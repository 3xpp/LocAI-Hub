[project]
name = "local-ai-workflow-hub"
version = "0.1.0"
description = "Local-first dashboard for local AI automation services"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi[standard]>=0.115,<1",
  "httpx>=0.28,<1",
  "sqlalchemy>=2.0,<3",
]

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
packages = ["local_ai_hub"]
